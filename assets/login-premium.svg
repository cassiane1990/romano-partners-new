<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0907"/><stop offset=".42" stop-color="#241b10"/><stop offset="1" stop-color="#070605"/></linearGradient>
  <radialGradient id="glow" cx=".45" cy=".28" r=".7"><stop offset="0" stop-color="#d7ae59" stop-opacity=".32"/><stop offset=".55" stop-color="#9b6a25" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#8b5b16"/><stop offset=".5" stop-color="#f2d486"/><stop offset="1" stop-color="#9a681f"/></linearGradient>
  <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3eee3" stop-opacity=".14"/><stop offset=".45" stop-color="#9c8769" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<rect width="1440" height="900" fill="url(#glow)"/>
<!-- luxury marble panels -->
<path d="M0 0H430L360 900H0Z" fill="url(#marble)"/>
<path d="M420 0H860L790 900H360Z" fill="#17120d" opacity=".7"/>
<path d="M0 620 C220 500 270 740 520 560 S850 500 1050 610" fill="none" stroke="#d6b978" stroke-opacity=".13" stroke-width="5"/>
<path d="M80 120 C250 250 300 70 470 190 S680 340 840 220" fill="none" stroke="#fff3d0" stroke-opacity=".08" stroke-width="3"/>
<path d="M620 0 C560 180 770 250 690 430 S740 690 650 900" fill="none" stroke="#e6c981" stroke-opacity=".1" stroke-width="7"/>
<!-- architectural arches -->
<g fill="none" stroke="url(#gold)" stroke-opacity=".55">
 <path d="M80 720V370 Q80 180 270 180 Q460 180 460 370V720" stroke-width="5"/>
 <path d="M115 720V380 Q115 220 270 220 Q425 220 425 380V720" stroke-width="1.5"/>
 <path d="M870 900V440 Q870 285 1030 285 Q1190 285 1190 440V900" stroke-width="4"/>
</g>
<!-- soft chandelier -->
<g fill="#f6d88c" opacity=".65" filter="url(#blur)">
 <circle cx="270" cy="145" r="34"/><circle cx="1030" cy="205" r="30"/>
</g>
<g fill="#f5d68b" opacity=".8">
 <circle cx="270" cy="142" r="5"/><circle cx="245" cy="168" r="3"/><circle cx="295" cy="168" r="3"/>
 <circle cx="1030" cy="200" r="5"/><circle cx="1000" cy="228" r="3"/><circle cx="1060" cy="228" r="3"/>
</g>
<!-- central emblem -->
<g transform="translate(270 430)" filter="url(#shadow)">
 <circle r="118" fill="#0b0907" stroke="#d7b36a" stroke-width="2"/>
 <circle r="101" fill="none" stroke="#d7b36a" stroke-opacity=".45"/>
 <path d="M-57 -58 L-57 60 M-57 -58 L-15 35 L28 -58 L28 60" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M-73 -92 L-48 -72 L-20 -98 L8 -72 L35 -95 L62 -70" fill="none" stroke="#f2d486" stroke-width="7" stroke-linejoin="round"/>
</g>
<text x="270" y="585" text-anchor="middle" fill="#f5dfae" font-family="Georgia,serif" font-size="43" letter-spacing="10">ROMANO</text>
<text x="270" y="618" text-anchor="middle" fill="#caa968" font-family="Arial,sans-serif" font-size="15" letter-spacing="7">PROPERTY CARE</text>
<line x1="145" y1="650" x2="395" y2="650" stroke="#d5b36b" stroke-width="1"/>
<text x="270" y="683" text-anchor="middle" fill="#ead6aa" font-family="Arial,sans-serif" font-size="13" letter-spacing="4">EXCELENCIA EN CADA DETALLE</text>
<!-- subtle service pillars -->
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="600" y="680" fill="#e5c985" font-size="12" letter-spacing="3">LIMPIEZA PROFESIONAL</text>
 <text x="600" y="710" fill="#bfa875" font-size="10" letter-spacing="2">MANTENIMIENTO INTEGRAL</text>
 <text x="600" y="740" fill="#bfa875" font-size="10" letter-spacing="2">CONTROL Y CALIDAD</text>
 <text x="600" y="770" fill="#bfa875" font-size="10" letter-spacing="2">EQUIPO ESPECIALIZADO</text>
</g>
<!-- floor reflection -->
<path d="M0 820 Q300 760 610 820 T1440 800V900H0Z" fill="#000" opacity=".25"/>
</svg>