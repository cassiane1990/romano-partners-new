name: ROMANO app update checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify automatic update detector
        shell: bash
        run: |
          grep -q 'async function checkRomanoProductionUpdate()' index.html
          grep -q 'romanoUpdatePending' index.html
          grep -q 'updateViaCache: "none"' index.html

      - name: Verify PWA cache refresh
        shell: bash
        run: |
          grep -q 'const CACHE="romano-pwa-v43";' sw.js
          grep -q 'SKIP_WAITING' sw.js
          grep -q 'clients.claim' sw.js

      - name: Verify cache-control headers
        shell: bash
        run: |
          grep -q 'no-cache, no-store, must-revalidate' _headers
