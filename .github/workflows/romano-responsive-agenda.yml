name: ROMANO app update checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify one-tap production update flow
        shell: bash
        run: |
          grep -q 'async function refreshRomanoApp()' index.html
          grep -q 'version.json?manual=' index.html
          grep -q 'romano-build' index.html
          grep -q 'updateViaCache:"none"' index.html
          grep -q 'window.location.reload()' index.html

      - name: Verify service worker refresh behavior
        shell: bash
        run: |
          grep -q 'const CACHE="romano-pwa-v61";' sw.js
          grep -q 'self.skipWaiting()' sw.js
          grep -q 'clients.claim()' sw.js
          grep -q 'cache:"no-store"' sw.js

      - name: Verify cache-control headers
        shell: bash
        run: |
          grep -q 'no-cache, no-store, must-revalidate' _headers
          grep -A1 '^/version.json$' _headers | grep -q 'no-cache, no-store, must-revalidate'
