name: ROMANO compact responsive agenda

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-responsive-agenda:
    if: ${{ !contains(github.event.head_commit.message, '[responsive-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive agenda patch
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '</style><style id="sj-quick-fix">'
          css = r'''<style id="romano-agenda-responsive-2026-09-24">
/* Agenda compacta e adaptativa: o layout responde ao espaço real disponível. */
.rpc-calendar,.rpc-month-calendar{width:100%;max-width:100%;min-width:0}
.rpc-calendar{padding:12px;border-radius:18px}
.rpc-calendar-head{gap:8px;margin-bottom:10px}
.rpc-calendar-title{gap:8px}
.rpc-calendar-icon{width:34px;height:34px;border-radius:10px;font-size:17px}
.rpc-calendar-title h2{font-size:20px}
.rpc-calendar-title p{font-size:10px}
.rpc-calendar-actions{gap:5px}
.rpc-calendar-actions .btn,.rpc-week-label{padding:7px 9px;font-size:10px}
.rpc-week-grid{grid-template-columns:repeat(7,minmax(132px,1fr));gap:6px}
.rpc-day{min-width:132px;min-height:285px;padding:6px;border-radius:12px}
.rpc-day-head{padding:5px 6px 7px;margin-bottom:6px}
.rpc-day-name{font-size:9px}.rpc-day-date{font-size:9px}
.rpc-day-count{min-width:19px;height:19px;font-size:9px;margin-top:-20px}
.rpc-service-card{border-radius:10px;margin-bottom:6px}
.rpc-service-photo{height:64px}
.rpc-service-body{padding:6px}
.rpc-service-time{font-size:14px}
.rpc-service-status{margin:3px 0 4px;padding:3px 6px;font-size:8px}
.rpc-service-code{font-size:9px}
.rpc-service-client,.rpc-service-property,.rpc-service-meta{font-size:8px;margin-top:3px}
.rpc-service-actions{gap:4px;margin-top:5px}
.rpc-service-actions .btn{padding:5px 4px;font-size:8px}
.rpc-calendar-legend{gap:5px;margin-top:8px}
.rpc-calendar-legend span{font-size:8px;padding:4px 7px}
.rpc-calendar-detail{padding:10px;margin-top:8px;border-radius:14px}
.rpc-calendar-detail-grid{gap:6px}
.rpc-calendar-detail-item{padding:7px 8px}
.rpc-calendar-detail-item small{font-size:8px}
.rpc-calendar-detail-item strong{font-size:10px}
.rpc-month-calendar{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rpc-weekdays,.rpc-month-grid{min-width:0;grid-template-columns:repeat(7,minmax(105px,1fr))}
.rpc-month-day,.rpc-empty-day{min-height:135px;padding:6px}
.rpc-date{font-size:11px}
.rpc-person-day{padding:5px;margin-bottom:4px}
.rpc-person-day b{font-size:8px}.rpc-person-day span{font-size:8px}

@media (max-width:1100px){
  .rpc-week-grid{grid-template-columns:repeat(7,minmax(118px,1fr))}
  .rpc-day{min-width:118px;min-height:250px}
  .rpc-service-photo{height:54px}
  .rpc-calendar{padding:10px}
}
@media (max-width:760px){
  .rpc-calendar-head{align-items:center;flex-wrap:wrap}
  .rpc-calendar-title{min-width:0;flex:1}
  .rpc-calendar-actions{width:100%;justify-content:flex-end}
  .rpc-week-grid{grid-template-columns:repeat(7,minmax(104px,1fr));gap:5px}
  .rpc-day{min-width:104px;min-height:220px;padding:5px}
  .rpc-service-photo{height:48px}
  .rpc-service-body{padding:5px}
  .rpc-service-time{font-size:13px}
  .rpc-service-client,.rpc-service-property,.rpc-service-meta{font-size:7px}
  .rpc-service-actions .btn{font-size:7px;padding:4px 3px}
  .rpc-month-calendar{border-radius:13px}
  .rpc-weekdays,.rpc-month-grid{grid-template-columns:repeat(7,minmax(94px,1fr));min-width:658px}
  .rpc-month-day,.rpc-empty-day{min-height:120px}
}
@media (max-width:600px){
  .rpc-calendar{padding:8px;border-radius:15px}
  .rpc-calendar-title h2{font-size:17px}
  .rpc-calendar-title p{font-size:8px}
  .rpc-calendar-actions{justify-content:stretch}
  .rpc-calendar-actions .btn{flex:1;min-width:0;padding:7px 5px;font-size:9px}
  .rpc-week-grid{grid-template-columns:repeat(7,minmax(92px,1fr));gap:4px}
  .rpc-day{min-width:92px;min-height:195px;border-radius:9px}
  .rpc-day-head{padding:4px;margin-bottom:4px}
  .rpc-day-name{font-size:8px}.rpc-day-date{font-size:8px}
  .rpc-service-photo{height:40px}
  .rpc-service-time{font-size:12px}
  .rpc-service-code{font-size:8px}
  .rpc-service-status{font-size:7px}
  .rpc-service-actions{display:grid;grid-template-columns:1fr}
  .rpc-service-actions .btn{width:100%}
}
@media (pointer:coarse) and (max-width:900px){
  .rpc-calendar .btn{min-height:40px}
  .rpc-service-card{cursor:pointer}
}
@media (orientation:landscape) and (max-height:600px){
  .rpc-calendar{padding:7px}
  .rpc-day{min-height:180px}
  .rpc-service-photo{height:36px}
}
</style>'''
          if 'romano-agenda-responsive-2026-09-24' not in s:
              if marker not in s:
                  raise SystemExit('agenda marker not found')
              s = s.replace(marker, css + marker, 1)
          marker2 = '</head>'
          js = r'''<script id="romano-device-detection-2026-09-24">
(function(){
  function setDeviceClass(){
    var w=Math.max(document.documentElement.clientWidth||0,window.innerWidth||0);
    var h=Math.max(document.documentElement.clientHeight||0,window.innerHeight||0);
    var ua=navigator.userAgent||'';
    var touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    var type=/iPad|Tablet|Android(?!.*Mobile)/i.test(ua)?'tablet':/Mobi|iPhone|Android/i.test(ua)?'phone':(w<=600?'phone':w<=1024?'tablet':'desktop');
    document.documentElement.dataset.rpcDevice=type;
    document.documentElement.dataset.rpcTouch=touch?'1':'0';
    document.documentElement.dataset.rpcOrientation=w>h?'landscape':'portrait';
  }
  setDeviceClass();
  window.addEventListener('resize',setDeviceClass,{passive:true});
  window.addEventListener('orientationchange',setDeviceClass,{passive:true});
})();
</script>'''
          if 'romano-device-detection-2026-09-24' not in s:
              s=s.replace(marker2,js+marker2,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit responsive patch
        run: |
          git config user.name "ROMANO responsive bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ajustar agenda e layout por dispositivo [responsive-patch]"
          git push
