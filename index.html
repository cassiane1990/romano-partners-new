<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROMANO PARTNERS · Property Care</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f2e9;color:#1c1c19}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#d4b06a30,transparent 35%),linear-gradient(135deg,#191916,#2c2a25)}
.card{background:#fffdf9;border:1px solid #e5dac8;border-radius:28px;box-shadow:0 30px 80px #0005}.login-card{width:min(460px,100%);padding:40px}.brand{text-align:center}.logo{width:86px;height:86px;border-radius:26px;margin:auto;background:radial-gradient(circle at 50% 38%,#f0d18c,#b7893f 70%);color:#fff;display:grid;place-items:center;font:700 48px Georgia,serif;box-shadow:0 0 0 1px #fff3,0 14px 40px #b7893f66}.brand h1{font:32px Georgia,serif;letter-spacing:3px;margin:20px 0 5px}.brand p{margin:0;color:#777;font-size:11px;letter-spacing:3px}.field{margin-top:18px}.field label{display:block;font-size:12px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #e5dac8;border-radius:13px;padding:11px 13px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#b7893f;box-shadow:0 0 0 3px #b7893f18}.primary{width:100%;height:48px;border:0;border-radius:999px;background:#1c1c19;color:white;font-weight:700;margin-top:22px}.msg{margin-top:14px;padding:11px 13px;border-radius:12px;background:#fff3df;color:#79561e;font-size:12px;line-height:1.4}
.app{min-height:100vh;display:flex}.side{width:250px;background:#1c1c19;color:white;padding:24px 16px;position:fixed;inset:0 auto 0 0;overflow:auto}.side-brand{padding:4px 10px 24px;border-bottom:1px solid #ffffff18}.side-brand strong{font:25px Georgia,serif;letter-spacing:2px}.side-brand span{display:block;color:#d4b06a;font-size:9px;letter-spacing:3px;margin-top:4px}.role{display:inline-block;margin-top:12px;padding:5px 9px;border:1px solid #ffffff18;border-radius:999px;color:#d4b06a;font-size:9px;text-transform:uppercase}.nav{padding-top:15px}.nav button{width:100%;border:0;background:transparent;color:#fff9;text-align:left;padding:11px 13px;border-radius:12px;margin:2px 0;font-size:13px}.nav button.active,.nav button:hover{background:#b7893f;color:white}.nav .section{color:#777;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:15px 13px 5px}.logout{margin-top:18px!important;color:#fff8!important}.main{margin-left:250px;flex:1}.top{height:76px;background:#fffdf9;border-bottom:1px solid #e5dac8;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.top h2{margin:0;font:25px Georgia,serif}.user{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:36px;height:36px;border-radius:50%;background:#b7893f;color:white;display:grid;place-items:center;font-weight:700}.content{padding:30px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{padding:20px;background:#fffdf9;border:1px solid #e5dac8;border-radius:18px}.stat small{color:#888;font-size:10px;text-transform:uppercase;letter-spacing:1px}.stat strong{display:block;font-size:28px;margin-top:8px}.panel{margin-top:20px;background:#fffdf9;border:1px solid #e5dac8;border-radius:20px;padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.panel h3{margin:0;font-size:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #e5dac8;background:#fffdf9;border-radius:10px;padding:8px 11px;font-size:11px}.btn.gold{background:#b7893f;color:#fff;border-color:#b7893f}.btn.dark{background:#1c1c19;color:#fff;border-color:#1c1c19}.pill{padding:5px 9px;border-radius:999px;background:#f7f2e9;color:#79561e;font-size:10px;white-space:nowrap}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee7dc;vertical-align:middle}.muted{color:#888}.empty{padding:35px;text-align:center;color:#999;font-size:12px}.status{padding:5px 8px;border-radius:999px;font-size:10px;background:#f3eee5}.status.in_progress{background:#efe5c9;color:#75591e}.status.completed,.status.approved{background:#e6efe6;color:#466247}.status.urgent,.status.rejected{background:#f6e3df;color:#8a4137}.status.on_the_way{background:#e7edf4;color:#48617c}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;padding:25px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;right:20px;bottom:20px;background:#1c1c19;color:#fff;padding:12px 15px;border-radius:12px;z-index:30;font-size:12px}
@media(max-width:900px){.side{width:72px;padding:18px 10px}.side-brand strong{font-size:0}.side-brand strong:after{content:"R";font-size:27px}.side-brand span,.side .role,.nav button span,.nav .section{display:none}.nav button{text-align:center}.main{margin-left:72px}.grid{grid-template-columns:repeat(2,1fr)}.content{padding:18px}}
@media(max-width:560px){.grid,.two{grid-template-columns:1fr}.top{padding:0 16px}.content{padding:14px}.login-card{padding:28px}.table{display:block;overflow:auto}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card login-card">
<div class="brand"><div class="logo">R</div><h1>ROMANO PARTNERS</h1><p>PROPERTY CARE · MANAGEMENT</p></div>
<form id="loginForm"><div class="field"><label>Correo electrónico</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="primary">Entrar al sistema</button><div id="loginMsg" class="msg hidden"></div></form>
</div></div>

<div id="mfa" class="login hidden"><div class="card login-card"><div class="brand"><div class="logo">R</div><h1>VERIFICACIÓN</h1><p>SEGURIDAD ROMANO PARTNERS</p></div>
<p class="muted">Introduce el código de tu aplicación autenticadora.</p><div class="field"><label>Código MFA</label><input id="mfaCode" inputmode="numeric" maxlength="6"></div>
<button id="mfaBtn" class="primary">Verificar</button><div id="mfaMsg" class="msg hidden"></div></div></div>

<div id="app" class="app hidden"><aside class="side"><div class="side-brand"><strong>ROMANO</strong><span>PARTNERS</span><div id="roleBadge" class="role"></div></div>
<nav class="nav">
<div class="section">Operación</div>
<button class="active" data-page="dashboard">◈ <span>Dashboard</span></button><button data-page="clients">♙ <span>Clientes</span></button><button data-page="properties">⌂ <span>Propiedades</span></button><button data-page="services">◉ <span>Servicios</span></button><button data-page="calendar">▦ <span>Calendario</span></button>
<div class="section">Empresa</div>
<button data-page="employees">♧ <span>Funcionarios</span></button><button data-page="documents">▤ <span>Documentos</span></button><button data-page="finance">€ <span>Finanzas</span></button><button data-page="stock">▥ <span>Materiales / Stock</span></button><button data-page="recurring">↻ <span>Servicios recurrentes</span></button><button data-page="notifications">! <span>Alertas</span></button><button data-page="security">⌘ <span>Seguridad / MFA</span></button>
<button id="logout" class="logout">↪ <span>Cerrar sesión</span></button></nav></aside>
<main class="main"><header class="top"><h2 id="pageTitle">Dashboard</h2><div class="user"><div id="userEmail"></div><div id="avatar" class="avatar">R</div></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal hidden"><div class="card modal-card"><div class="panel-head"><h3 id="modalTitle"></h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://ztjfvqcutwlfbqmtclyv.supabase.co";
const SUPABASE_KEY="sb_publishable_OwekejMFUr_3hdujnJzxOw_SI-5vEJj";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id); let currentUser=null,currentProfile=null;
const roleNames={admin:"Administrador",supervisor:"Supervisor",employee:"Funcionario",client:"Cliente"};
const statusNames={requested:"Solicitado",scheduled:"Programado",on_the_way:"A camino",in_progress:"Iniciado",paused:"Pausado",supervised:"Supervisado",completed:"Finalizado",approved:"Aprobado",rejected:"Rechazado",returned:"Devuelto",cancelled:"Cancelado"};

const pages={dashboard:["Dashboard",renderDashboard],clients:["Clientes",renderClients],properties:["Propiedades",renderProperties],services:["Servicios",renderServices],calendar:["Calendario",renderCalendar],employees:["Funcionarios",renderEmployees],documents:["Documentos",renderDocuments],finance:["Finanzas",renderFinance],stock:["Materiales / Stock",renderStock],recurring:["Servicios recurrentes",renderRecurring],notifications:["Alertas",renderNotifications],security:["Seguridad / MFA",renderSecurity]};

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3000)}
function openModal(t,html){$("modalTitle").textContent=t;$("modalBody").innerHTML=html;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
function role(){return currentProfile?.role}
function canManage(){return ["admin","supervisor"].includes(role())}

async function profileLoad(){const {data,error}=await sb.from("profiles").select("id,company_id,full_name,email,role,active").eq("id",currentUser.id).maybeSingle();if(error||!data)throw error||new Error("Perfil no encontrado.");currentProfile=data}
async function ensureMFA(){const a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(a.error)throw a.error;if(a.data.currentLevel==="aal1"&&a.data.nextLevel==="aal2"){$("mfa").classList.remove("hidden");return false}return true}
async function mfaVerify(){const code=$("mfaCode").value.trim();if(!code)return;$("mfaMsg").classList.add("hidden");const f=await sb.auth.mfa.listFactors();if(f.error||!f.data.totp.length){$("mfaMsg").textContent="No se encontró un factor TOTP activo.";$("mfaMsg").classList.remove("hidden");return}const factorId=f.data.totp[0].id;const c=await sb.auth.mfa.challenge({factorId});if(c.error){$("mfaMsg").textContent=c.error.message;$("mfaMsg").classList.remove("hidden");return}const v=await sb.auth.mfa.verify({factorId,challengeId:c.data.id,code});if(v.error){$("mfaMsg").textContent=v.error.message;$("mfaMsg").classList.remove("hidden");return}$("mfa").classList.add("hidden");showApp()}
$("mfaBtn").onclick=mfaVerify;

async function count(table){const r=await sb.from(table).select("*",{count:"exact",head:true});return r.count||0}
async function renderDashboard(){const list=[["Clientes","clients"],["Propiedades","properties"],["Servicios","services"],["Funcionarios","employee_profiles"],["Facturas","invoices"],["Alertas","notifications"]];const counts=await Promise.all(list.map(x=>count(x)));const recent=await sb.from("services").select("id,code,status,service_type,typology,scheduled_at").order("scheduled_at",{ascending:true}).limit(8);$("content").innerHTML='<div class="grid">'+counts.map((n,i)=>'<div class="stat"><small>'+list[i][0]+'</small><strong>'+n+'</strong></div>').join("")+'</div><div class="panel"><div class="panel-head"><h3>Acciones rápidas</h3><div class="actions"><button class="btn gold" onclick="openPage('clients')">Clientes</button><button class="btn" onclick="openPage('properties')">Propiedades</button><button class="btn" onclick="openPage('services')">Servicios</button><button class="btn" onclick="openPage('finance')">Finanzas</button><button class="btn" onclick="openPage('notifications')">Alertas</button></div></div></div><div class="panel"><div class="panel-head"><h3>Servicios próximos</h3><span class="pill">'+roleNames[role()]+'</span></div>'+serviceTable(recent.data||[])+'</div><div class="panel"><div class="panel-head"><h3>Arquitectura de producción</h3><span class="pill">PostgreSQL · RLS</span></div><p class="muted">La base está preparada para operación por roles, aislamiento por cliente/funcionario, trazabilidad de estados, documentos, finanzas, stock, recurrencias y MFA. Los datos operativos permanecen vacíos hasta que sean introducidos por la empresa.</p></div>'}
function serviceTable(rows){if(!rows.length)return'<div class="empty">No hay servicios registrados.</div>';return'<table class="table"><thead><tr><th>Código</th><th>Tipo</th><th>Tipología</th><th>Estado</th><th>Programado</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.service_type)+'</td><td>'+esc(x.typology||"—")+'</td><td><span class="status '+esc(x.status)+'">'+esc(statusNames[x.status]||x.status)+'</span></td><td>'+esc(x.scheduled_at?new Date(x.scheduled_at).toLocaleString("es-ES"):"—")+'</td></tr>').join("")+'</tbody></table>'}

async function renderClients(){const r=await sb.from("clients").select("id,name,email,phone,created_at").order("created_at",{ascending:false});let h='<div class="panel"><div class="panel-head"><h3>Clientes</h3><button class="btn" onclick="reloadCurrentPage()">Actualizar</button>'+(canManage()?'<button class="btn gold" onclick="newClient()">+ Nuevo cliente</button>':'')+'</div>';h+=r.error?'<div class="msg">'+esc(r.error.message)+'</div>':r.data?.length?'<table class="table"><thead><tr><th>Cliente</th><th>Email</th><th>Teléfono</th><th>Código</th><th></th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email||"—")+'</td><td>'+esc(x.phone||"—")+'</td><td>'+esc(x.id.slice(0,8).toUpperCase())+'</td><td><button class="btn" onclick="viewClient(\''+x.id+'\')">Ver</button></td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay clientes.</div>';$("content").innerHTML=h+"</div>"}
function newClient(){openModal("Nuevo cliente",'<form onsubmit="saveClient(event)"><div class="two"><div class="field"><label>Nombre</label><input id="cName" required></div><div class="field"><label>Email</label><input id="cEmail" type="email"></div></div><div class="field"><label>Teléfono</label><input id="cPhone"></div><div class="field"><label>Notas</label><textarea id="cNotes"></textarea></div><button class="primary">Guardar cliente</button></form>')}
async function saveClient(e){e.preventDefault();const r=await sb.from("clients").insert({company_id:currentProfile.company_id,name:$("cName").value.trim(),email:$("cEmail").value.trim()||null,phone:$("cPhone").value.trim()||null,notes:$("cNotes").value.trim()||null});if(r.error){toast(r.error.message);return}closeModal();toast("Cliente creado");renderClients()}

async function renderProperties(){const r=await sb.from("properties").select("id,code,name,property_type,address,city,country,client_id,status").order("created_at",{ascending:false});let h='<div class="panel"><div class="panel-head"><h3>Propiedades</h3><div class="actions"><button class="btn" onclick="reloadCurrentPage()">Actualizar</button><button class="btn gold" onclick="newProperty()">+ Nueva propiedad</button></div></div>';h+=r.error?'<div class="msg">'+esc(r.error.message)+'</div>':r.data?.length?'<table class="table"><thead><tr><th>Código</th><th>Propiedad</th><th>Tipología</th><th>Ubicación</th><th>Estado</th><th></th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.property_type||"—")+'</td><td>'+esc([x.city,x.country].filter(Boolean).join(", ")||x.address||"—")+'</td><td>'+esc(x.status)+'</td><td><button class="btn" onclick="viewProperty(\''+x.id+'\')">Ver</button></td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay propiedades.</div>';$("content").innerHTML=h+"</div>"}
async function newProperty(){const c=await sb.from("clients").select("id,name").order("name");const own=role()==="client"?c.data||[]:c.data||[];openModal("Nueva propiedad",'<form onsubmit="saveProperty(event)"><div class="two"><div class="field"><label>Nombre</label><input id="pName" required></div><div class="field"><label>Código</label><input id="pCode" placeholder="Ej. RPC-T1-001" required></div></div><div class="two"><div class="field"><label>Tipología</label><select id="pType"><option>T1</option><option>T2</option><option>T3</option><option>T4</option><option>T5</option></select></div><div class="field"><label>Cliente</label><select id="pClient" '+(role()==="client"?"disabled":"")+'>'+own.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></div></div><div class="field"><label>Dirección</label><input id="pAddress"></div><div class="two"><div class="field"><label>Ciudad</label><input id="pCity"></div><div class="field"><label>País</label><input id="pCountry" value="España"></div></div><button class="primary">Guardar propiedad</button></form>')}
async function saveProperty(e){e.preventDefault();let clientId=$("pClient").value;if(role()==="client"){const me=await sb.from("clients").select("id").eq("profile_id",currentUser.id).single();if(me.error){toast("No se encontró el cliente.");return}clientId=me.data.id}const r=await sb.from("properties").insert({company_id:currentProfile.company_id,client_id:clientId,code:$("pCode").value.trim(),name:$("pName").value.trim(),property_type:$("pType").value,address:$("pAddress").value.trim(),city:$("pCity").value.trim(),country:$("pCountry").value.trim()});if(r.error){toast(r.error.message);return}closeModal();toast("Propiedad creada");renderProperties()}

async function renderServices(){const r=await sb.from("services").select("id,code,service_type,typology,status,priority,scheduled_at,assigned_employee_id,assigned_supervisor_id").order("scheduled_at",{ascending:true}).limit(100);let h='<div class="panel"><div class="panel-head"><h3>Servicios</h3><div class="actions"><button class="btn" onclick="reloadCurrentPage()">Actualizar</button><button class="btn gold" onclick="newService()">+ Nuevo servicio</button></div></div>';h+=r.error?'<div class="msg">'+esc(r.error.message)+'</div>':r.data?.length?'<table class="table"><thead><tr><th>Código</th><th>Servicio</th><th>Tipología</th><th>Prioridad</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.service_type)+'</td><td>'+esc(x.typology||"—")+'</td><td>'+esc(x.priority)+'</td><td><span class="status '+esc(x.status)+'">'+esc(statusNames[x.status]||x.status)+'</span></td><td>'+statusAction(x)+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay servicios.</div>';$("content").innerHTML=h+"</div>"}
function statusAction(x){if(!["admin","supervisor","employee"].includes(role()))return"—";const allowed=role()==="employee"?["on_the_way","in_progress","paused","completed"]:["scheduled","on_the_way","in_progress","paused","supervised","completed","approved","rejected"];return'<select class="btn" onchange="changeStatus(\''+x.id+'\',this.value)"><option value="">Cambiar estado</option>'+allowed.map(s=>'<option value="'+s+'">'+statusNames[s]+'</option>').join("")+'</select>'}
async function changeStatus(id,status){if(!status)return;const r=await sb.from("services").update({status}).eq("id",id);if(r.error)toast(r.error.message);else{toast("Estado actualizado");renderServices()}}
async function newService(){const p=await sb.from("properties").select("id,name,property_type").order("name");openModal("Nuevo servicio",'<form onsubmit="saveService(event)"><div class="two"><div class="field"><label>Código</label><input id="sCode" required></div><div class="field"><label>Tipo de servicio</label><select id="sType"><option>limpieza_alojamiento</option><option>limpieza_hotel_5_estrellas</option><option>oficina</option><option>clinica</option><option>mantenimiento</option><option>pintura</option><option>fontaneria</option><option>electricidad</option><option>lavanderia</option></select></div></div><div class="two"><div class="field"><label>Propiedad</label><select id="sProp">'+(p.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+' · '+esc(x.property_type||"")+'</option>').join("")+'</select></div><div class="field"><label>Tipología</label><select id="sTyp"><option>T1</option><option>T2</option><option>T3</option><option>T4</option><option>T5</option></select></div></div><div class="two"><div class="field"><label>Fecha y hora</label><input id="sDate" type="datetime-local"></div><div class="field"><label>Prioridad</label><select id="sPriority"><option>normal</option><option>high</option><option>urgent</option></select></div></div><div class="field"><label>Instrucciones</label><textarea id="sNotes"></textarea></div><button class="primary">Crear servicio</button></form>')}
async function saveService(e){e.preventDefault();const prop=$("sProp").value;const r=await sb.from("properties").select("client_id").eq("id",prop).single();if(r.error){toast(r.error.message);return}const x=await sb.from("services").insert({company_id:currentProfile.company_id,client_id:r.data.client_id,property_id:prop,code:$("sCode").value.trim(),service_type:$("sType").value,typology:$("sTyp").value,priority:$("sPriority").value,scheduled_at:$("sDate").value?new Date($("sDate").value).toISOString():null,instructions:$("sNotes").value.trim()||null,status:"requested"});if(x.error){toast(x.error.message);return}closeModal();toast("Servicio creado");renderServices()}

async function viewClient(id){const r=await sb.from("clients").select("*").eq("id",id).single();if(r.error){toast(r.error.message);return}const x=r.data;openModal("Ficha del cliente",'<div class="two"><div><small class="muted">Nombre</small><p><strong>'+esc(x.name)+'</strong></p></div><div><small class="muted">Código</small><p>'+esc(x.id.slice(0,8).toUpperCase())+'</p></div><div><small class="muted">Email</small><p>'+esc(x.email||"—")+'</p></div><div><small class="muted">Teléfono</small><p>'+esc(x.phone||"—")+'</p></div></div>')}
async function viewProperty(id){const r=await sb.from("properties").select("*").eq("id",id).single();if(r.error){toast(r.error.message);return}const x=r.data;openModal("Ficha de propiedad",'<div class="two"><div><small class="muted">Código</small><p><strong>'+esc(x.code)+'</strong></p></div><div><small class="muted">Nombre</small><p>'+esc(x.name)+'</p></div><div><small class="muted">Tipología</small><p>'+esc(x.property_type||"—")+'</p></div><div><small class="muted">Estado</small><p>'+esc(x.status||"—")+'</p></div><div style="grid-column:1/-1"><small class="muted">Dirección</small><p>'+esc([x.address,x.city,x.country].filter(Boolean).join(", ")||"—")+'</p></div></div>')}
async function viewService(id){const r=await sb.from("services").select("*").eq("id",id).single();if(r.error){toast(r.error.message);return}const x=r.data;openModal("Ficha del servicio",'<div class="two"><div><small class="muted">Código</small><p><strong>'+esc(x.code)+'</strong></p></div><div><small class="muted">Tipo</small><p>'+esc(x.service_type||"—")+'</p></div><div><small class="muted">Tipología</small><p>'+esc(x.typology||"—")+'</p></div><div><small class="muted">Prioridad</small><p>'+esc(x.priority||"—")+'</p></div><div><small class="muted">Estado</small><p>'+esc(statusNames[x.status]||x.status||"—")+'</p></div><div><small class="muted">Programado</small><p>'+esc(x.scheduled_at?new Date(x.scheduled_at).toLocaleString("es-ES"):"—")+'</p></div></div><div class="field"><label>Instrucciones</label><textarea readonly>'+esc(x.instructions||"—")+'</textarea></div>')}
function reloadCurrentPage(){const active=document.querySelector(".nav button.active");openPage(active?.dataset.page||"dashboard")}

async function renderCalendar(){const r=await sb.from("services").select("code,service_type,typology,status,scheduled_at").not("scheduled_at","is",null).order("scheduled_at",{ascending:true}).limit(100);$("content").innerHTML='<div class="panel"><div class="panel-head"><h3>Calendario operativo</h3><span class="pill">Servicios programados</span></div>'+(r.data?.length?'<table class="table"><thead><tr><th>Fecha</th><th>Código</th><th>Servicio</th><th>Tipología</th><th>Estado</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(new Date(x.scheduled_at).toLocaleString("es-ES"))+'</td><td>'+esc(x.code)+'</td><td>'+esc(x.service_type)+'</td><td>'+esc(x.typology||"—")+'</td><td>'+esc(statusNames[x.status]||x.status)+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay servicios programados.</div>')+'</div>'}

async function renderEmployees(){const r=await sb.from("employee_profiles").select("id,employee_code,phone,email,nif_nie,hire_date,function_title,salary,active").order("created_at",{ascending:false});$("content").innerHTML='<div class="panel"><div class="panel-head"><h3>Funcionarios · Ficha profesional</h3><span class="pill">'+(r.data?.length||0)+' registros</span></div>'+(r.data?.length?'<table class="table"><thead><tr><th>Código</th><th>Función</th><th>Email</th><th>NIF/NIE</th><th>Alta</th><th>Estado</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.employee_code)+'</td><td>'+esc(x.function_title||"—")+'</td><td>'+esc(x.email||"—")+'</td><td>'+esc(x.nif_nie||"—")+'</td><td>'+esc(x.hire_date||"—")+'</td><td>'+esc(x.active?"Activo":"Inactivo")+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay funcionarios.</div>')+'</div>'}

async function renderDocuments(){const r=await sb.from("documents").select("id,title,document_type,file_name,created_at,client_id").order("created_at",{ascending:false}).limit(100);$("content").innerHTML='<div class="panel"><div class="panel-head"><h3>Documentos seguros</h3><span class="pill">Storage + RLS</span></div><p class="muted">Contratos, recibos, facturas y documentos quedan vinculados al registro y sujetos a permisos del backend.</p>'+(r.data?.length?'<table class="table"><thead><tr><th>Documento</th><th>Tipo</th><th>Archivo</th><th>Fecha</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.document_type)+'</td><td>'+esc(x.file_name)+'</td><td>'+esc(new Date(x.created_at).toLocaleDateString("es-ES"))+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay documentos cargados.</div>')+'</div>'}

async function renderFinance(){const r=await sb.from("invoices").select("number,status,subtotal,tax_rate,tax_amount,total,due_at,paid_at,created_at").order("created_at",{ascending:false}).limit(100);const p=await sb.from("payments").select("amount,method,paid_at").order("paid_at",{ascending:false}).limit(20);$("content").innerHTML='<div class="grid"><div class="stat"><small>Facturas</small><strong>'+((r.data||[]).length)+'</strong></div><div class="stat"><small>Total facturado</small><strong>'+((r.data||[]).reduce((a,x)=>a+Number(x.total||0),0)).toFixed(2)+' €</strong></div><div class="stat"><small>Pagos registrados</small><strong>'+((p.data||[]).length)+'</strong></div><div class="stat"><small>Pagado</small><strong>'+((p.data||[]).reduce((a,x)=>a+Number(x.amount||0),0)).toFixed(2)+' €</strong></div></div><div class="panel"><div class="panel-head"><h3>Facturación</h3><span class="pill">Servicio → factura → pago → costes → margen</span></div>'+(r.data?.length?'<table class="table"><thead><tr><th>Nº</th><th>Estado</th><th>Base</th><th>IVA</th><th>Total</th><th>Vencimiento</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.number)+'</td><td>'+esc(x.status)+'</td><td>'+Number(x.subtotal||0).toFixed(2)+' €</td><td>'+Number(x.tax_amount||0).toFixed(2)+' €</td><td><strong>'+Number(x.total||0).toFixed(2)+' €</strong></td><td>'+esc(x.due_at?new Date(x.due_at).toLocaleDateString("es-ES"):"—")+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay facturas. Los valores reales de ROMANO PROPERTY CARE se introducirán cuando sean incorporados al sistema.</div>')+'</div>'}

async function renderStock(){const r=await sb.from("stock_items").select("name,sku,unit,quantity,min_quantity").order("name");$("content").innerHTML='<div class="panel"><div class="panel-head"><h3>Materiales y stock</h3><span class="pill">Control operativo</span></div>'+(r.data?.length?'<table class="table"><thead><tr><th>Material</th><th>SKU</th><th>Unidad</th><th>Cantidad</th><th>Mínimo</th><th>Estado</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.sku||"—")+'</td><td>'+esc(x.unit)+'</td><td>'+esc(x.quantity)+'</td><td>'+esc(x.min_quantity)+'</td><td>'+((Number(x.quantity)<=Number(x.min_quantity))?'<span class="status urgent">Reponer</span>':'<span class="status approved">OK</span>')+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay materiales registrados.</div>')+'</div>'}

async function renderRecurring(){const r=await sb.from("recurring_services").select("id,frequency,typology,priority,active,next_run_at,instructions").order("next_run_at",{ascending:true});$("content").innerHTML='<div class="panel"><div class="panel-head"><h3>Servicios recurrentes</h3><span class="pill">Programación automática</span></div>'+(r.data?.length?'<table class="table"><thead><tr><th>Frecuencia</th><th>Tipología</th><th>Prioridad</th><th>Próxima ejecución</th><th>Activo</th></tr></thead><tbody>'+r.data.map(x=>'<tr><td>'+esc(x.frequency)+'</td><td>'+esc(x.typology||"—")+'</td><td>'+esc(x.priority)+'</td><td>'+esc(x.next_run_at?new Date(x.next_run_at).toLocaleString("es-ES"):"—")+'</td><td>'+esc(x.active?"Sí":"No")+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No hay servicios recurrentes.</div>')+'</div>'}

async function renderNotifications(){const r=await sb.from("notifications").select("title,body,severity,read_at,created_at").order("created_at",{ascending:false}).limit(50);$("content").innerHTML='<div class="panel"><div class="panel-head"><h3>Centro de alertas</h3><span class="pill">Incidencias · vencimientos · supervisión</span></div>'+(r.data?.length?r.data.map(x=>'<div class="panel" style="margin-top:10px"><strong>'+esc(x.title)+'</strong><div class="muted">'+esc(x.body||"")+'</div><small>'+esc(x.severity)+' · '+esc(new Date(x.created_at).toLocaleString("es-ES"))+'</small></div>').join(""):'<div class="empty">No hay alertas.</div>')+'</div>'}

async function renderSecurity(){const f=await sb.auth.mfa.listFactors();const enabled=f.data?.totp?.some(x=>x.status==="verified");$("content").innerHTML='<div class="panel"><div class="panel-head"><h3>Seguridad y MFA</h3><span class="pill">'+(enabled?"MFA activo":"MFA no configurado")+'</span></div><p class="muted">El sistema utiliza Supabase Auth, sesiones reales y políticas RLS server-side. MFA TOTP se puede configurar para cuentas administrativas.</p><div class="actions"><button class="btn gold" onclick="enrollMFA()">Configurar MFA</button></div><div id="mfaSetup"></div></div>'}
async function enrollMFA(){const e=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"ROMANO PARTNERS"});if(e.error){toast(e.error.message);return}$("mfaSetup").innerHTML='<div class="panel"><h3>Escanea el QR</h3><img style="width:220px;margin:15px 0" src="data:image/svg+xml;utf8,'+encodeURIComponent(e.data.totp.qr_code)+'"><div class="muted">Si no puedes escanearlo, usa el secreto: <strong>'+esc(e.data.totp.secret)+'</strong></div><div class="field"><label>Código del autenticador</label><input id="enrollCode" inputmode="numeric" maxlength="6"></div><button class="primary" onclick="verifyEnrollment(\''+e.data.id+'\')">Activar MFA</button></div>'}
async function verifyEnrollment(id){const c=await sb.auth.mfa.challenge({factorId:id});if(c.error){toast(c.error.message);return}const v=await sb.auth.mfa.verify({factorId:id,challengeId:c.data.id,code:$("enrollCode").value.trim()});if(v.error){toast(v.error.message);return}toast("MFA activado");renderSecurity()}

function showApp(){$("login").classList.add("hidden");$("mfa").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=currentUser?.email||"";$("roleBadge").textContent=roleNames[role()]||role()||"Usuario";$("avatar").textContent=(currentProfile?.full_name||"R").charAt(0).toUpperCase();openPage("dashboard")}
function showLogin(msg){$("app").classList.add("hidden");$("mfa").classList.add("hidden");$("login").classList.remove("hidden");if(msg){$("loginMsg").textContent=msg;$("loginMsg").classList.remove("hidden")}}
async function openPage(key){const p=pages[key];if(!p)return;$("pageTitle").textContent=p[0];document.querySelectorAll(".nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===key));try{await p[1]()}catch(e){$("content").innerHTML='<div class="panel"><div class="msg">'+esc(e.message||e)+'</div></div>'}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").classList.add("hidden");const r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){$("loginMsg").textContent=r.error.message;$("loginMsg").classList.remove("hidden");return}currentUser=r.data.user;try{await profileLoad();if(!(await ensureMFA()))return;showApp()}catch(err){await sb.auth.signOut();showLogin(err.message)}});
$("logout").onclick=async()=>{await sb.auth.signOut();currentUser=null;currentProfile=null;showLogin()};
document.querySelectorAll(".nav button[data-page]").forEach(b=>b.onclick=()=>openPage(b.dataset.page));
sb.auth.onAuthStateChange(async(_event,session)=>{if(!session){currentUser=null;currentProfile=null;showLogin();return}if(currentUser?.id===session.user.id)return;currentUser=session.user;try{await profileLoad();if(await ensureMFA())showApp()}catch(e){await sb.auth.signOut();showLogin(e.message)}});
(async()=>{const s=await sb.auth.getSession();if(s.data.session){currentUser=s.data.session.user;try{await profileLoad();if(await ensureMFA())showApp()}catch(e){await sb.auth.signOut();showLogin(e.message)}}})();
</script></body></html>
