const OFFLINE_DB_NAME="romano-partners-offline-v1";
const OFFLINE_STORE="mutations";
let __offlineDb=null;
let __offlineSyncing=false;
let __offlineListenersReady=false;

function offlineDb(){
 return new Promise((resolve,reject)=>{
  if(__offlineDb)return resolve(__offlineDb);
  const req=indexedDB.open(OFFLINE_DB_NAME,1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(OFFLINE_STORE)){const s=db.createObjectStore(OFFLINE_STORE,{keyPath:"id"});s.createIndex("user_status",["userId","localStatus"]);s.createIndex("created_at","createdAt")}};
  req.onsuccess=()=>{__offlineDb=req.result;resolve(__offlineDb)};
  req.onerror=()=>reject(req.error);
 });
}
async function offlinePut(item){
 const db=await offlineDb();
 return new Promise((resolve,reject)=>{const tx=db.transaction(OFFLINE_STORE,"readwrite");tx.objectStore(OFFLINE_STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
}
async function offlineAll(){
 const db=await offlineDb();
 return new Promise((resolve,reject)=>{const tx=db.transaction(OFFLINE_STORE,"readonly");const req=tx.objectStore(OFFLINE_STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});
}
async function offlineDelete(id){
 const db=await offlineDb();
 return new Promise((resolve,reject)=>{const tx=db.transaction(OFFLINE_STORE,"readwrite");tx.objectStore(OFFLINE_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
}
function networkError(error){const m=String(error?.message||error||"").toLowerCase();return !navigator.onLine||/failed to fetch|network|offline|load failed|fetch error|connection/i.test(m)}
async function queueOfflineMutation(mutationType,payload,baseUpdatedAt=null){
 if(!currentUser||!currentProfile)throw new Error("Sesión no disponible para guardar offline.");
 const item={id:crypto.randomUUID(),userId:currentUser.id,companyId:currentProfile.company_id,mutationType,payload,baseUpdatedAt,localStatus:"pending",createdAt:new Date().toISOString(),attempts:0,lastError:null};
 await offlinePut(item);updateOfflineIndicator();return item;
}
async function syncOfflineQueue(){
 if(__offlineSyncing||!navigator.onLine||!currentUser||!currentProfile)return;
 __offlineSyncing=true;updateOfflineIndicator("Sincronizando…");
 try{
  const all=await offlineAll();
  const pending=all.filter(x=>x.userId===currentUser.id&&x.localStatus==="pending").sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  for(const item of pending){
   try{
    const ins=await sb.from("offline_mutations").insert({id:item.id,company_id:item.companyId,user_id:item.userId,mutation_type:item.mutationType,payload:item.payload,base_updated_at:item.baseUpdatedAt,status:"pending"}).select("id,status,last_error,attempts,applied_at").single();
    let row=ins.data;
    if(ins.error&&ins.error.code!=="23505")throw ins.error;
    if(!row){
      const q=await sb.from("offline_mutations").select("id,status,last_error,attempts,applied_at").eq("id",item.id).single();
      if(q.error)throw q.error; row=q.data;
    }
    item.localStatus=row.status;item.lastError=row.last_error||null;item.attempts=(row.attempts||item.attempts||0);item.syncedAt=row.applied_at||new Date().toISOString();
    await offlinePut(item);
    if(row.status==="applied"){await offlineDelete(item.id)}
   }catch(err){
    item.attempts=(item.attempts||0)+1;item.lastError=err.message||String(err);
    await offlinePut(item);
    if(networkError(err))break;
   }
  }
 }finally{__offlineSyncing=false;updateOfflineIndicator()}
}
async function pendingOfflineCount(){
 const all=await offlineAll().catch(()=>[]);
 return all.filter(x=>x.userId===currentUser?.id&&x.localStatus==="pending").length;
}
async function updateOfflineIndicator(override){
 const el=$("syncStatus");if(!el)return;
 const n=await pendingOfflineCount();
 el.textContent=override||(!navigator.onLine?("OFFLINE · "+n+" pendientes"):(n?("ONLINE · "+n+" pendientes"):"ONLINE · sincronizado"));
 el.classList.toggle("gold",!navigator.onLine||n>0);
}

 '<div class="panel" style="margin-top:12px"><div class="panel-head"><h3>Dispatch</h3><span class="pill">5 min</span></div>'+
 ((dispatch.data||[]).map(d=>'<div class="line"><span>'+esc(d.employee_id||"—")+'<br><small>'+esc(d.response)+' · '+esc(d.distance_m?Math.round(d.distance_m)+" m":"distancia não disponível")+'</small></span><span>'+esc(d.expires_at?new Date(d.expires_at).toLocaleTimeString("es-ES"):"—")+'</span></div>').join("")||'<div class="empty">Sem tentativas.</div>')+

async function setServiceStatusPremium(id,status){
 const now=new Date().toISOString();
 const patch={status,updated_at:now};
 if(status==="in_progress")patch.started_at=now;
 if(status==="completed")patch.finished_at=now;
 const cachedBase=window.__romanoServiceVersions?.[id]||null;
 if(!navigator.onLine){
   if(!cachedBase){toast("Abra la ficha del servicio antes de trabajar sin conexión.");return}
   await queueOfflineMutation("service_status",{service_id:id,status,started_at:patch.started_at||null,finished_at:patch.finished_at||null},cachedBase);
   toast("Sin conexión · estado guardado para sincronizar");
   return;
 }
 const current=await sb.from("services").select("id,updated_at").eq("id",id).single();
 if(current.error){toast(current.error.message);return}
 const r=await sb.from("services").update(patch).eq("id",id).eq("updated_at",current.data.updated_at);
 if(r.error){if(networkError(r.error)){await queueOfflineMutation("service_status",{service_id:id,status,started_at:patch.started_at||null,finished_at:patch.finished_at||null},current.data.updated_at);toast("Red interrumpida · estado puesto en cola")}else toast(r.error.message);return}
 toast("Estado actualizado");closeModal();renderServicesMaster();updateOfflineIndicator()
}
async function uploadServiceMedia(serviceId){
 const file=$("serviceMediaFile")?.files?.[0];if(!file)return;
 const ext=(file.name.split(".").pop()||"bin").toLowerCase();
 const type=file.type.startsWith("video")?"video":file.type.startsWith("audio")?"audio":"photo";
 const path=currentProfile.company_id+"/"+serviceId+"/"+crypto.randomUUID()+"."+ext;
 const up=await sb.storage.from("service-media").upload(path,file,{upsert:false,contentType:file.type});
 if(up.error){toast(up.error.message);return}
 const ins=await sb.from("service_media").insert({company_id:currentProfile.company_id,service_id:serviceId,uploaded_by:currentUser.id,media_type:type,storage_path:path,file_name:file.name,mime_type:file.type,size_bytes:file.size});
 if(ins.error){await sb.storage.from("service-media").remove([path]);toast(ins.error.message);return}
 toast("Evidencia guardada");viewService(serviceId)
}
async function downloadServiceMedia(path){
 const r=await sb.storage.from("service-media").createSignedUrl(path,300);

}

$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").classList.add("hidden");const r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){$("loginMsg").textContent=r.error.message;$("loginMsg").classList.remove("hidden");return}currentUser=r.data.user;try{await profileLoad();if(!(await ensureMFA()))return;showApp()}catch(err){await sb.auth.signOut();showLogin(err.message)}});

 if(!email||password.length<8){toast("Informe email e uma contraseña de mínimo 8 caracteres.");return}
 const name=prompt("Nombre completo para el primer acceso:");
 const r=await sb.auth.signUp({email,password,options:{data:{full_name:name||"ROMANO User"}}});
 if(r.error){$("loginMsg").textContent=r.error.message;$("loginMsg").classList.remove("hidden");return}
 toast("Cuenta creada. Si el proyecto exige confirmación, revise el correo.");
};

async function saveQualityChecklist(e){
 e.preventDefault();
 const score=Math.max(0,Math.min(100,Number($("qScore").value||0))),id=crypto.randomUUID(),completedAt=new Date().toISOString();
 const payload={id,service_id:$("qService").value,checklist_type:$("qType").value,score,passed:$("qPassed").value==="true",observations:$("qObs").value.trim()||null,completed_at:completedAt};
 if(!navigator.onLine){await queueOfflineMutation("quality_create",payload);closeModal();toast("Sin conexión · checklist guardado para sincronizar");return}
 const r=await sb.from("quality_checklists").insert({company_id:currentProfile.company_id,...payload,completed_by:currentUser.id});
 if(r.error){if(networkError(r.error)){await queueOfflineMutation("quality_create",payload);closeModal();toast("Red interrumpida · checklist puesto en cola")}else toast(r.error.message);return}
 closeModal();toast("Checklist guardado");quality();updateOfflineIndicator();

async function resolveEmergency(id){
 const resolution=prompt("Resolución / acción realizada:");if(!resolution)return;
 const payload={occurrence_id:id,resolution:resolution.trim(),resolved_at:new Date().toISOString()};
 if(!navigator.onLine){await queueOfflineMutation("occurrence_resolve",payload);toast("Sin conexión · resolución guardada para sincronizar");return}
 const r=await sb.from("occurrences").update({status:"resolved",resolution:payload.resolution,resolved_at:payload.resolved_at}).eq("id",id);
 if(r.error){if(networkError(r.error)){await queueOfflineMutation("occurrence_resolve",payload);toast("Red interrumpida · resolución puesta en cola")}else toast(r.error.message);return}
 toast("Incidencia resuelta");emergency();updateOfflineIndicator()
}
async function startServiceGPS(serviceId){
 if(!navigator.geolocation){toast("El navegador no permite geolocalización.");return}
 if(window.__romanoWatchId!=null)navigator.geolocation.clearWatch(window.__romanoWatchId);
 const push=async pos=>{
   const payload={id:crypto.randomUUID(),service_id:serviceId,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy_m:pos.coords.accuracy,recorded_at:new Date().toISOString()};
   if(!navigator.onLine){await queueOfflineMutation("location_insert",payload);return}
   const r=await sb.from("employee_locations").insert({company_id:currentProfile.company_id,profile_id:currentUser.id,...payload});
   if(r.error){if(networkError(r.error)){await queueOfflineMutation("location_insert",payload)}else toast(r.error.message)}
 };
 navigator.geolocation.getCurrentPosition(push,()=>toast("No fue posible obtener la ubicación."),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
 window.__romanoWatchId=navigator.geolocation.watchPosition(push,()=>{}, {enableHighAccuracy:true,maximumAge:15000,timeout:20000});
 toast("GPS del servicio activado");
}
function stopServiceGPS(){if(window.__romanoWatchId!=null){navigator.geolocation.clearWatch(window.__romanoWatchId);window.__romanoWatchId=null;toast("GPS del servicio detenido")}}

function masterFilterProperties(){const cid=$("mpClient").value;document.querySelectorAll("#mpProperty option").forEach(o=>o.hidden=false);masterRecalc()}
function masterRecalc(){
 const vat=Number($("mpVat")?.value||21)/100,lines=[];const cl=MASTER_PRICES.cleaning.find(x=>x.code===$("mpCleaning")?.value);if(cl&&cl.price!=null)lines.push({name:cl.name,price:cl.price,tax:cl.tax});
 document.querySelectorAll(".mpItem:checked").forEach(x=>{const p=Number(x.dataset.price||0);if(p>0)lines.push({name:x.dataset.name,price:p,tax:x.dataset.tax==="1"})});
 const mt=MASTER_PRICES.maintenance.find(x=>x.code===$("mpMaint")?.value);if(mt)lines.push({name:mt.name,price:mt.price,tax:true});
 let sub=0,tax=0,total=0;lines.forEach(x=>{const gross=x.price;if(x.tax){const net=gross/(1+vat);sub+=net;tax+=gross-net;total+=gross}else{sub+=gross;total+=gross}});
 $("mpLines").innerHTML=lines.length?lines.map(x=>"<div class='line-item'><span>"+esc(x.name)+"</span><b>"+masterMoney(x.price)+"</b></div>").join(""):"<div class='empty'>Añada elementos.</div>";
 $("mpSub").textContent=masterMoney(sub);$("mpTax").textContent=masterMoney(tax);$("mpTotal").textContent=masterMoney(total);$("mpSub").dataset.v=sub;$("mpTax").dataset.v=tax;$("mpTotal").dataset.v=total;
}
async function savePremiumService(){
 if(demoMode){toast("Modo demostración: no se escribe en producción.");return}
 const prop=$("mpProperty").value;if(!prop){toast("Seleccione una propiedad.");return}
 const pr=await sb.from("properties").select("client_id").eq("id",prop).single();if(pr.error){toast(pr.error.message);return}
 const selected=[...document.querySelectorAll(".mpItem:checked")].map(x=>({code:x.dataset.code,quantity:1})).filter(x=>x.code);
 const mt=$("mpMaint").value;if(mt)selected.push({code:mt,quantity:1});
 const pricingCode=$("mpCleaning").value||null;
 const taxCountry=$("mpVat").value==="23"?"PT":"ES";
 const code="SRV-"+new Date().getFullYear()+"-"+String(Date.now()).slice(-6);
 const s=await sb.from("services").insert({
   company_id:currentProfile.company_id,
   client_id:pr.data.client_id,
   property_id:prop,
   code,
   service_type:$("mpType").value,
   typology:(pricingCode||"T1").split("-")[0],
   pricing_code:pricingCode,
   tax_country:taxCountry,
   requested_items:selected,
   priority:$("mpPriority").value,
   scheduled_at:new Date($("mpDate").value).toISOString(),
   instructions:$("mpNotes").value.trim()||null,
   notes:$("mpMaintNote").value.trim()||null,
   status:"requested",
   client_requested_at:new Date().toISOString()
 }).select("id").single();
 if(s.error){toast(s.error.message);return}
 const ev=await sb.from("service_events").insert({company_id:currentProfile.company_id,service_id:s.data.id,actor_id:currentUser.id,event_type:"requested",metadata:{dispatch_window_minutes:5,pricing_source:"service_catalog"}});
 if(ev.error){toast(ev.error.message);return}
 closeModal();toast("Pedido "+code+" creado · valores calculados por el catálogo oficial · dispatch activo");renderServicesMaster();
}
